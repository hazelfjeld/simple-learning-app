<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Music" />
  <meta name="description" content="Your local music library." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>Music</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0b0c;--panel:#151517;--raised:#1c1c1f;--line:#ffffff12;--line2:#ffffff1d;--text:#f3f3f4;--muted:#949499;--soft:#cfcfd3;--button:#ececef;--buttonText:#111113;--danger:#ff8d8d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{padding-bottom:120px;background:radial-gradient(circle at 50% -10rem,#242427 0,transparent 34rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}
    .topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:#0b0b0cd1;backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:11px}.brand img{width:39px;height:39px;border-radius:12px}.brand strong,.brand small{display:block}.brand strong{font-size:1rem;letter-spacing:-.02em}.brand small{margin-top:1px;color:var(--muted);font-size:.72rem}.top-actions{display:flex;gap:8px}
    .button,.icon{border:0;text-decoration:none}.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 15px;border-radius:13px;font-weight:720}.primary{background:var(--button);color:var(--buttonText)}.secondary{background:#ffffff0b;color:var(--soft);border:1px solid var(--line)}.ghost{background:transparent;color:var(--muted)}.danger{background:#ff737310;color:var(--danger);border:1px solid #ff737320}.icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#ffffff0b;color:var(--soft)}
    main{width:min(960px,100%);margin:auto;padding:28px 18px 64px}.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:22px;padding:clamp(25px,5vw,44px);border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#1b1b1e,#121214);box-shadow:0 24px 80px #0007}h1,h2,h3,p{margin-top:0}h1{max-width:700px;margin-bottom:11px;font-size:clamp(2.4rem,8vw,5rem);line-height:.95;letter-spacing:-.07em;font-weight:760}.hero p{max-width:540px;margin-bottom:0;color:var(--muted);line-height:1.55}.local-note{margin:14px 2px 34px;color:var(--muted);font-size:.78rem}
    .section-head,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-head h2{margin:0;font-size:1.45rem;letter-spacing:-.035em}#count{color:var(--muted);font-size:.83rem}.toolbar{margin:16px 0}.search{flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding:0 13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--muted)}.search input{width:100%;min-width:0;padding:13px 0;border:0;outline:0;background:transparent;color:var(--text)}select{padding:12px;border:1px solid var(--line);border-radius:14px;outline:0;color:var(--soft);background:var(--panel)}
    .empty{padding:76px 20px;text-align:center;border:1px solid var(--line);border-radius:23px;background:#ffffff04;color:var(--muted)}.empty img{width:70px;height:70px;margin-bottom:17px;opacity:.85;border-radius:20px}.empty h3{margin-bottom:7px;color:var(--text);font-size:1.15rem}.empty p{margin-bottom:20px}
    .tracks{display:grid;gap:8px;margin:0;padding:0;list-style:none}.track{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:9px;border:1px solid transparent;border-radius:17px;background:var(--panel)}.track.active{border-color:var(--line2);background:var(--raised)}.track-main{display:flex;align-items:center;gap:13px;min-width:0;padding:0;border:0;background:transparent;color:inherit;text-align:left}.art{width:57px;height:57px;flex:0 0 auto;object-fit:cover;border-radius:13px;background:#222226}.track-copy{min-width:0}.track-copy strong,.track-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track-copy strong{letter-spacing:-.015em}.track-copy span,.duration{margin-top:4px;color:var(--muted);font-size:.82rem}
    .player{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;width:min(930px,calc(100% - 20px));padding:11px;border:1px solid var(--line2);border-radius:21px;background:#19191cf0;box-shadow:0 18px 70px #000b;backdrop-filter:blur(25px)}.now{display:flex;align-items:center;gap:11px;min-width:0}.now img{width:51px;height:51px;object-fit:cover;border-radius:12px}.now div{min-width:0}.now strong,.now span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now span{margin-top:3px;color:var(--muted);font-size:.8rem}.controls{display:flex;align-items:center;gap:8px}.play{width:48px;height:48px;border:0;border-radius:50%;background:var(--button);color:var(--buttonText);font-size:1rem}
    dialog{width:min(520px,calc(100% - 24px));padding:0;border:1px solid var(--line2);border-radius:23px;background:#171719;color:var(--text);box-shadow:0 30px 120px #000}dialog::backdrop{background:#000b;backdrop-filter:blur(6px)}.modal{padding:23px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{margin-bottom:0;letter-spacing:-.035em}.drop{display:block;margin:19px 0 11px;padding:29px 16px;border:1px dashed #ffffff24;border-radius:18px;background:#ffffff05;text-align:center}.drop span{display:block;margin-top:7px;color:var(--muted);font-size:.82rem}.drop input{width:100%;margin-top:15px;color:var(--muted)}.import-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:6px}.fields{display:grid;gap:12px}label>span{display:block;margin-bottom:6px;color:var(--muted);font-size:.78rem}.fields input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:0;background:#0e0e10;color:var(--text)}.edit-art{display:flex;align-items:center;gap:15px;margin:16px 0}.edit-art img{width:78px;height:78px;object-fit:cover;border-radius:16px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:19px}.actions.split{justify-content:space-between}.status{min-height:1.3em;margin-top:10px;color:var(--muted);font-size:.82rem}.toast{position:fixed;left:50%;bottom:125px;z-index:30;transform:translateX(-50%);padding:11px 15px;border-radius:999px;background:var(--button);color:var(--buttonText);box-shadow:0 10px 40px #0008;font-weight:700;white-space:nowrap}[hidden]{display:none!important}
    @media(max-width:680px){body{padding-bottom:178px}.top-actions .secondary{display:none}.hero{grid-template-columns:1fr}.hero .button{width:100%}.toolbar{align-items:stretch}select{max-width:130px}.track{grid-template-columns:minmax(0,1fr) auto}.duration{display:none}.player{grid-template-columns:1fr}.controls{justify-content:center}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="./icon.svg" alt="" /><span><strong>Music</strong><small>library</small></span></div>
    <div class="top-actions"><a class="button secondary" href="./import-url.html">From URL</a><button class="button primary" id="importTop" type="button">Add</button></div>
  </header>

  <main>
    <section class="hero"><div><h1>Your music.</h1><p>Stored here. Ready when you are.</p></div><button class="button primary" id="importHero" type="button">Add music</button></section>
    <p class="local-note">Stored on this device.</p>
    <section>
      <div class="section-head"><h2>Library</h2><span id="count">0 songs</span></div>
      <div class="toolbar"><label class="search">⌕<input id="search" type="search" placeholder="Search" aria-label="Search library" /></label><select id="sort" aria-label="Sort library"><option value="recent">Recent</option><option value="title">Title</option><option value="artist">Artist</option></select></div>
      <div class="empty" id="empty"><img src="./icon.svg" alt="" /><h3>No music yet</h3><p>Add audio files to start.</p><button class="button secondary" id="importEmpty" type="button">Add music</button></div>
      <ul class="tracks" id="tracks"></ul>
    </section>
  </main>

  <section class="player" id="player" aria-label="Now playing" hidden><div class="now"><img id="nowArt" alt="" /><div><strong id="nowTitle"></strong><span id="nowArtist"></span></div></div><div class="controls"><button class="icon" id="prev" type="button" aria-label="Previous">◀</button><button class="play" id="play" type="button" aria-label="Play">▶</button><button class="icon" id="next" type="button" aria-label="Next">▶</button></div><audio id="audio" preload="metadata"></audio></section>

  <dialog id="importDialog"><form class="modal" id="importForm"><div class="modal-head"><h2>Add music</h2><button class="icon" type="button" data-close="importDialog" aria-label="Close">×</button></div><label class="drop"><strong>Choose audio files</strong><span>Select one or more files.</span><input id="files" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac" multiple required /></label><div class="import-options"><a class="button secondary" href="./import-url.html">From URL</a><button class="button primary" type="submit">Add files</button></div><div class="status" id="importStatus"></div></form></dialog>

  <dialog id="editDialog"><form class="modal" id="editForm"><div class="modal-head"><h2>Edit</h2><button class="icon" type="button" data-close="editDialog" aria-label="Close">×</button></div><div class="edit-art"><img id="editPreview" alt="Artwork" /><label><span>Artwork</span><input id="editArt" type="file" accept="image/*" /></label></div><div class="fields"><label><span>Title</span><input id="editTitle" required maxlength="180" /></label><label><span>Artist</span><input id="editArtist" maxlength="180" /></label><label><span>Album</span><input id="editAlbum" maxlength="180" /></label></div><div class="status" id="editStatus"></div><div class="actions split"><button class="button danger" type="button" id="delete">Delete</button><div><button class="button ghost" type="button" data-close="editDialog">Cancel</button><button class="button primary" type="submit">Save</button></div></div></form></dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    const DB_NAME='slopskip-public-v1',STORE='tracks',$=s=>document.querySelector(s);
    let tracks=[],visible=[],current=null,audioUrl=null,nowArtUrl=null,artUrls=[],editing=null,pendingArt=null;
    const audio=$('#audio'),player=$('#player');
    const fallback='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" rx="54" fill="#202023"/><path d="M75 222V78h43l32 55 32-55h43v144h-42v-75l-33 55-33-55v75z" fill="#ececef"/></svg>`);
    function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore(STORE,{keyPath:'id'});s.createIndex('createdAt','createdAt')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
    async function all(){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
    async function put(v){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
    async function del(id){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
    function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}
    function fileTitle(n){return n.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim()||'Untitled'}
    function clock(n){if(!Number.isFinite(n))return'';n=Math.max(0,Math.floor(n));return`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
    function duration(file){return new Promise(res=>{const a=document.createElement('audio'),u=URL.createObjectURL(file);a.preload='metadata';a.onloadedmetadata=()=>{const d=a.duration;URL.revokeObjectURL(u);res(Number.isFinite(d)?d:0)};a.onerror=()=>{URL.revokeObjectURL(u);res(0)};a.src=u})}
    function text(bytes){return new TextDecoder('latin1').decode(bytes).replace(/\0+$/,'').trim()}
    function synchsafe(b){return(b[0]<<21)|(b[1]<<14)|(b[2]<<7)|b[3]}
    async function tags(file){if(!/\.mp3$/i.test(file.name))return{};try{const b=new Uint8Array(await file.slice(0,1024*1024).arrayBuffer());if(text(b.slice(0,3))!=='ID3')return{};let p=10,end=10+synchsafe(b.slice(6,10)),out={};while(p+10<=end&&p+10<=b.length){const f=text(b.slice(p,p+4));if(!f)break;const size=b[3]===4?synchsafe(b.slice(p+4,p+8)):((b[p+4]<<24)>>>0)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7];if(!size||p+10+size>b.length)break;const d=b.slice(p+10,p+10+size);if(['TIT2','TPE1','TALB'].includes(f)){const v=text(d.slice(1));if(f==='TIT2')out.title=v;if(f==='TPE1')out.artist=v;if(f==='TALB')out.album=v}if(f==='APIC'){let i=1;while(i<d.length&&d[i])i++;const mime=text(d.slice(1,i));i+=2;while(i<d.length&&d[i])i++;i++;if(i<d.length)out.artwork=new Blob([d.slice(i)],{type:mime||'image/jpeg'})}p+=10+size}return out}catch{return{}}}
    function art(t){if(!t.artwork)return fallback;const u=URL.createObjectURL(t.artwork);artUrls.push(u);return u}
    function clearArts(){artUrls.forEach(URL.revokeObjectURL);artUrls=[]}
    async function refresh(){tracks=await all();filter()}
    function filter(){const q=$('#search').value.trim().toLowerCase(),s=$('#sort').value;visible=tracks.filter(t=>!q||[t.title,t.artist,t.album].some(v=>(v||'').toLowerCase().includes(q))).sort((a,b)=>s==='title'?a.title.localeCompare(b.title):s==='artist'?(a.artist||'').localeCompare(b.artist||''):b.createdAt-a.createdAt);render()}
    function render(){clearArts();$('#tracks').replaceChildren();$('#count').textContent=`${tracks.length} ${tracks.length===1?'song':'songs'}`;$('#empty').hidden=tracks.length>0;for(const t of visible){const li=document.createElement('li');li.className='track'+(current===t.id&&!audio.paused?' active':'');li.innerHTML=`<button class="track-main" type="button"><img class="art" alt=""><span class="track-copy"><strong></strong><span></span></span></button><span class="duration"></span><button class="icon edit" type="button" aria-label="Edit">•••</button>`;li.querySelector('.art').src=art(t);li.querySelector('strong').textContent=t.title;li.querySelector('.track-copy span').textContent=[t.artist,t.album].filter(Boolean).join(' · ')||'Unknown';li.querySelector('.duration').textContent=clock(t.duration);li.querySelector('.track-main').onclick=()=>playTrack(t.id);li.querySelector('.edit').onclick=()=>openEdit(t.id);$('#tracks').append(li)}}
    async function playTrack(id,auto=true){const t=tracks.find(x=>x.id===id);if(!t)return;if(audioUrl)URL.revokeObjectURL(audioUrl);if(nowArtUrl)URL.revokeObjectURL(nowArtUrl);audioUrl=URL.createObjectURL(t.audio);audio.src=audioUrl;current=t.id;player.hidden=false;nowArtUrl=t.artwork?URL.createObjectURL(t.artwork):null;$('#nowArt').src=nowArtUrl||fallback;$('#nowTitle').textContent=t.title;$('#nowArtist').textContent=t.artist||'Unknown';if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||'',album:t.album||'',artwork:t.artwork?[{src:$('#nowArt').src,type:t.artwork.type||'image/jpeg'}]:[]});if(auto)try{await audio.play()}catch{}render()}
    function move(dir){if(!visible.length)return;let i=visible.findIndex(t=>t.id===current);if(i<0)i=0;playTrack(visible[(i+dir+visible.length)%visible.length].id)}
    async function importFiles(e){e.preventDefault();const fs=[...$('#files').files];if(!fs.length)return;let done=0;for(const[i,f]of fs.entries()){ $('#importStatus').textContent=`Adding ${i+1} of ${fs.length}…`;try{const m=await tags(f);await put({id:uid(),title:m.title||fileTitle(f.name),artist:m.artist||'Unknown',album:m.album||'',audio:f,artwork:m.artwork||null,duration:await duration(f),createdAt:Date.now()+i});done++}catch(err){console.error(err)}}if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});$('#importDialog').close();e.target.reset();$('#importStatus').textContent='';await refresh();toast(`Added ${done} ${done===1?'song':'songs'}.`)}
    function openEdit(id){const t=tracks.find(x=>x.id===id);if(!t)return;editing=t.id;pendingArt=t.artwork||null;$('#editTitle').value=t.title;$('#editArtist').value=t.artist||'';$('#editAlbum').value=t.album||'';$('#editPreview').src=t.artwork?URL.createObjectURL(t.artwork):fallback;$('#editDialog').showModal()}
    async function saveEdit(e){e.preventDefault();const t=tracks.find(x=>x.id===editing);if(!t)return;const playing=current===t.id&&!audio.paused;await put({...t,title:$('#editTitle').value.trim()||t.title,artist:$('#editArtist').value.trim()||'Unknown',album:$('#editAlbum').value.trim(),artwork:pendingArt});$('#editDialog').close();await refresh();if(current===t.id)playTrack(t.id,playing);toast('Saved.')}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(t._x);t._x=setTimeout(()=>t.hidden=true,2200)}
    ['#importTop','#importHero','#importEmpty'].forEach(s=>$(s).onclick=()=>$('#importDialog').showModal());document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$('#importForm').onsubmit=importFiles;$('#editForm').onsubmit=saveEdit;$('#search').oninput=filter;$('#sort').onchange=filter;$('#play').onclick=()=>audio.paused?audio.play():audio.pause();$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);audio.onplay=()=>{$('#play').textContent='Ⅱ';render()};audio.onpause=()=>{$('#play').textContent='▶';render()};audio.onended=()=>move(1);$('#editArt').onchange=e=>{const f=e.target.files[0];if(f){pendingArt=f;$('#editPreview').src=URL.createObjectURL(f)}};$('#delete').onclick=async()=>{if(!editing||!confirm('Delete this song?'))return;const was=current===editing;await del(editing);$('#editDialog').close();if(was){audio.pause();audio.removeAttribute('src');current=null;player.hidden=true}await refresh();toast('Deleted.')};
    if('mediaSession'in navigator){for(const[a,f]of Object.entries({play:()=>audio.play(),pause:()=>audio.pause(),previoustrack:()=>move(-1),nexttrack:()=>move(1)}))try{navigator.mediaSession.setActionHandler(a,f)}catch{}}
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    refresh().catch(err=>{console.error(err);toast('Library unavailable.')});
  </script>
</body>
</html>
