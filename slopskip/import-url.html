<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fbfaf9" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Music" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>Add from URL · Music</title>
  <style>
    :root{color-scheme:light;--bg:#fbfaf9;--panel:#fffdfd;--line:#ded5d7;--line2:#cfc3c6;--text:#665e60;--muted:#9a9093;--button:#f1e4e7;--buttonText:#665b5e;--danger:#b96f77;--shadow:rgba(118,104,109,.14)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% -8rem,#fff 0,transparent 34rem),linear-gradient(180deg,var(--bg),#f7f1f2);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    .card{width:min(560px,100%);padding:26px;border:1px solid var(--line);border-radius:27px;background:rgba(255,253,253,.9);box-shadow:0 28px 85px var(--shadow)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:40px;font-weight:750}.brand img{width:50px;height:50px;border-radius:16px;box-shadow:0 8px 22px var(--shadow)}
    h1{margin:0 0 10px;font-size:clamp(2.2rem,9vw,4rem);line-height:.96;letter-spacing:-.065em;color:var(--text)}p{margin:0;color:var(--muted);line-height:1.55}
    label>span{display:block;margin-bottom:7px;color:#81777a;font-size:.8rem;font-weight:680}.field{margin:25px 0 15px}
    input[type=url]{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;outline:0;background:#fffafa;color:var(--text);font:inherit}
    .permission{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fbf6f7}.permission input{margin-top:3px}.permission label{color:#81777a;font-size:.82rem;line-height:1.45}
    .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:11px 15px;border-radius:14px;font:inherit;font-weight:720;text-decoration:none}.primary{background:var(--button);color:var(--buttonText);border:1px solid #e4d5d9}.secondary{background:#fffafa;color:#81777a;border:1px solid var(--line)}.button:disabled{opacity:.5}
    .status{min-height:1.35em;margin-top:14px;color:var(--muted);font-size:.82rem}.status.error{color:var(--danger)}.fine{margin-top:18px;font-size:.74rem}
    @media(max-width:520px){.actions{display:grid}.button{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="./icon.svg" alt="" /><span>Music</span></div>
    <h1>Add from URL</h1>
    <p>Paste a direct audio link.</p>

    <div class="field">
      <label for="url"><span>URL</span></label>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com/song.mp3" />
    </div>

    <div class="permission">
      <input id="permission" type="checkbox" />
      <label for="permission">I have permission to save this audio.</label>
    </div>

    <div id="status" class="status" role="status"></div>

    <div class="actions">
      <a class="button secondary" href="./music.html">Back</a>
      <button id="import" class="button primary" type="button">Add</button>
    </div>

    <p class="fine">Direct audio files only. Maximum 250 MB.</p>
  </main>

  <script>
    const DB_NAME='slopskip-public-v1',STORE='tracks',MAX_SIZE=250*1024*1024;
    const urlInput=document.querySelector('#url'),permission=document.querySelector('#permission'),button=document.querySelector('#import'),status=document.querySelector('#status');
    function setStatus(message,isError=false){status.textContent=message;status.classList.toggle('error',isError)}
    function openDb(){return new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>{const store=request.result.createObjectStore(STORE,{keyPath:'id'});store.createIndex('createdAt','createdAt')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
    async function save(track){const database=await openDb();return new Promise((resolve,reject)=>{const request=database.transaction(STORE,'readwrite').objectStore(STORE).put(track);request.onsuccess=()=>resolve();request.onerror=()=>reject(request.error)})}
    function makeId(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}
    function cleanName(value){return value.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim()||'Imported audio'}
    function getFilename(response,originalUrl){const disposition=response.headers.get('content-disposition')||'';const match=disposition.match(/filename\*=UTF-8''([^;]+)|filename="?([^";]+)"?/i);let name='';try{name=match?decodeURIComponent(match[1]||match[2]):decodeURIComponent(new URL(response.url||originalUrl).pathname.split('/').pop()||'')}catch{}return name||'imported-audio'}
    function readDuration(blob){return new Promise(resolve=>{const audio=document.createElement('audio'),objectUrl=URL.createObjectURL(blob);audio.preload='metadata';audio.onloadedmetadata=()=>{const value=audio.duration;URL.revokeObjectURL(objectUrl);resolve(Number.isFinite(value)?value:0)};audio.onerror=()=>{URL.revokeObjectURL(objectUrl);resolve(0)};audio.src=objectUrl})}
    async function importAudio(){
      if(!permission.checked){setStatus('Confirm permission first.',true);return}
      let source;try{source=new URL(urlInput.value.trim())}catch{setStatus('Enter a valid URL.',true);return}
      if(!['http:','https:'].includes(source.protocol)){setStatus('Use an http or https URL.',true);return}
      button.disabled=true;setStatus('Downloading…');
      try{
        const response=await fetch(source.href,{mode:'cors',redirect:'follow'});
        if(!response.ok)throw new Error(`Server returned ${response.status}.`);
        const type=(response.headers.get('content-type')||'').split(';')[0].trim().toLowerCase();
        if(!type.startsWith('audio/'))throw new Error('That link is not a direct audio file.');
        const declaredSize=Number(response.headers.get('content-length')||0);if(declaredSize>MAX_SIZE)throw new Error('File is larger than 250 MB.');
        const blob=await response.blob();if(!blob.size)throw new Error('The file is empty.');if(blob.size>MAX_SIZE)throw new Error('File is larger than 250 MB.');
        const name=getFilename(response,source.href),file=new File([blob],name,{type:type||blob.type,lastModified:Date.now()});
        await save({id:makeId(),title:cleanName(name),artist:'Unknown',album:'',audio:file,artwork:null,duration:await readDuration(blob),createdAt:Date.now(),sourceUrl:source.href});
        if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
        setStatus('Added.');setTimeout(()=>location.href='./music.html',450);
      }catch(error){console.error(error);const hint=error instanceof TypeError?' The source may block browser downloads.':'';setStatus((error.message||'Could not add audio.')+hint,true)}finally{button.disabled=false}
    }
    button.addEventListener('click',importAudio);urlInput.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();importAudio()}});
  </script>
</body>
</html>
